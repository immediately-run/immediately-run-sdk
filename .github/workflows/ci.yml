name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# R-TA-1 (TESTING_AUTOMATION_SPEC §6): publishing a public artifact is
# DECISION-gated, not mechanical — an npm version is irreversible and
# consumer-facing, so it is production-promotion-class. The release half is
# therefore split out of the PR-validating build into its own job that declares
# `environment: production` (a GitHub Environments protection rule with required
# reviewers = the one-click human approval), and asserts at run time that the
# approval actually happened. Keeping it in one job would have gated every PR
# run behind an approval too, which is why this is a split rather than one added
# line.
jobs:
  # Runs on every PR and every push to main. Holds NO write/publish authority —
  # the release job below is the only one that does.
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false  # never use caching in release builds
      # Trusted publishing requires npm >= 11.5.1. Pin to the 11.x line: npm@latest
      # went to 12.0.0 (2026-07), whose provenance path throws `Cannot find module
      # 'sigstore'` under `npm publish` (a .0 major regression that broke the 0.29.0
      # publish here, and 0.5.0 in the transpiler). 11.x stays >= 11.5.1 and
      # publishes cleanly; revisit when 12.x is fixed.
      - run: npm install -g npm@11
      - run: npm ci
      # The formatting gate. `format:check`, never `format -- --check`: appending
      # --check to a `prettier --write` script does not make it read-only — Prettier
      # rewrites the tree and exits 0, which is how the sandbox repo drifted 106 files
      # behind a step that looked like a gate.
      - run: npm run format:check
      # Fail fast on a circular import — the sandbox bundler infinite-loops on one
      # at app boot ("Maximum call stack size exceeded"). Caught the 0.2.7 cycle.
      - run: npm run check:circular
      - run: npm test
      - run: npm run build
      # Fail if a public export was removed/renamed vs api-snapshot.json — pinned
      # forks depend on the API never shrinking (SDK_PACKAGING_SPEC §9). Runs after
      # build because it reads the emitted dist/*.d.ts.
      - run: npm run api:check
      # R3-274 (PLATFORM_LAYERING_SPEC §2, Phase 1): the WIRE surface, which
      # `api:check` never sees — it compares module exports, not message names.
      # Renaming or reshaping a sandbox↔SDK message breaks every app pinned to an
      # older SDK against a newer frame; before this gate any wire string could
      # change with nothing firing (a live instance already exists: `fs-change`
      # carries two shapes). Extracts from src/ with the TypeScript checker, so it
      # runs without a build. `--self-test` runs alongside: a gate that finds zero
      # names must fail, not pass.
      - run: npm run protocol:check
      - run: npm run protocol:selftest
      # R3-274e1: `protocol:check` proves THIS source matches the pinned contract.
      # It says nothing about the SDKs already on npm, which is the population that
      # actually matters — apps pin their own version (SDK_PACKAGING_SPEC §9), so a
      # wire change breaks artifacts nobody can edit any more. This unpacks real
      # published tarballs and drives their `dist/` against the shared fixture, so
      # the verdict is measured, not reasoned about. Listed here and not left to
      # `verify` alone: this job enumerates the gates rather than running `verify`,
      # so a gate that is only in `verify` is a gate CI does not have.
      - run: npm run compat:selftest
      - run: npm run compat:previous
      # R3-166: the gate-table→SDK descriptor set is the proposed single source for
      # the generated surface. This fails if it disagrees with what actually ships —
      # a descriptor naming an export the SDK doesn't have, or making a different
      # wire call. Without it the descriptors drift silently, and the drift is only
      # discovered by whoever finally tries to generate from them (they had, to a
      # `shareSpace` method that never existed). Reads the built dist/, so it runs
      # after `build`. NOT in `prepublishOnly`: nothing published consumes the
      # descriptors yet, so this must never be what blocks a release.
      - run: npm run verify:codegen-parity
      - run: npm run docs

  # The public-release job: gh-pages self-host artifact + integrity trust root +
  # git tag + npm publish. Every step here is irreversible or consumer-facing.
  #
  # ⚠ OPERATOR PREREQUISITE (one-time, per repo — cannot be done from a PR):
  #   Settings → Environments → New environment `production` → enable
  #   "Required reviewers" and add the maintainer(s).
  # Declaring `environment:` for an environment that does not exist makes GitHub
  # AUTO-CREATE it with NO protection rules — i.e. the gate silently becomes a
  # no-op, the exact failure this item exists to remove. That is why the first
  # step below re-reads this run's own approval history and FAILS CLOSED when no
  # human approval is recorded, instead of trusting the `environment:` key.
  # `deploy/scripts/verify-release-gates.mjs` is the settings-side companion
  # check (run it after configuring the environment).
  release:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # gh-pages deploy + integrity trust-root commit/tag
      id-token: write   # npm trusted publishing (OIDC)
      actions: read     # read THIS run's approval history (the assertion below)
    steps:
      # Fail-closed authority gate (ways_of_working §2 "authority gates fail
      # closed"): a run that reached here without a recorded `production`
      # approval means the protection rule is missing or was removed. Refuse to
      # publish rather than publish an irreversible version unattended.
      - name: Assert this run cleared the `production` approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPROVALS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals")
          COUNT=$(printf '%s' "$APPROVALS" | jq '[.[] | select(.state == "approved") | select(any(.environments[]?; .name == "production"))] | length')
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::No human approval recorded for environment 'production' on this run. The Environments protection rule is missing (GitHub auto-creates an UNPROTECTED environment when one is declared but absent). Configure Settings → Environments → production → Required reviewers, then re-run. Refusing to publish an irreversible public version unattended (TESTING_AUTOMATION_SPEC R-TA-1)."
            exit 1
          fi
          printf '%s' "$APPROVALS" | jq -r '.[] | select(.state == "approved") | "approved by \(.user.login): \(.comment // "")"'

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - run: npm install -g npm@11
      - run: npm ci
      # A fresh build in the release job: jobs share no filesystem, and the
      # gh-pages payload below is assembled from `dist/` + `docs/`. The
      # correctness gates (test / check:circular / api:check / codegen-parity)
      # are NOT repeated — `needs: build-test` already required them to pass on
      # this exact commit.
      - run: npm run build
      - run: npm run docs

      # Assemble the gh-pages payload: typedoc docs at the root + the versioned,
      # self-hosted SDK build under v/<version>/ (SDK_PACKAGING_SPEC §5 — the
      # SOLE SDK delivery path; every app's pinned version resolves from here,
      # available the instant this CI finishes, no npm→CDN replication lag).
      # build-selfhost.mjs also emits v/<version>/integrity.json (SHA-384 per
      # fetchable file, §5.2) so verifiers can pin the artifact bytes. The
      # backfill step adds integrity.json for every PUBLISHED version from the
      # floor (0.2.8) up to current, so the trust root + sdk-integrity.json cover
      # the whole floor..current pin range (SP2-2) — idempotent, skips versions
      # already present (keep_files preserves the rest of each immutable dir).
      - name: Assemble gh-pages payload (docs + versioned SDK build + integrity)
        run: |
          rm -rf gh-pages-publish
          cp -r docs gh-pages-publish
          node scripts/build-selfhost.mjs gh-pages-publish
          node scripts/backfill-all-integrity.mjs 0.2.8 gh-pages-publish

      # R3-288: the payload the sandbox loads has no dependency tree, so a bare
      # specifier that is not app-provided is a module-not-found at boot — a blank
      # frame for every app on that version. 0.45.0/0.45.1 shipped four such files
      # past a green `api:check`, a valid integrity manifest and a green `verify`:
      # those check the SHAPE of the surface and the INTEGRITY of the bytes, and
      # neither asks whether the bytes can load. Runs BEFORE the deploy, so a
      # payload that cannot load never reaches the origin.
      - name: Assert the self-hosted payload is resolvable in the sandbox
        run: |
          node scripts/check-selfhost-resolvable.mjs --self-test
          node scripts/check-selfhost-resolvable.mjs --dir "gh-pages-publish/v/$(node -p "require('./package.json').version")"

      # SDK trust root (SDK_PACKAGING_SPEC §5.2.1 / SP2-2, decision #6): the hashes
      # site-main pins must come from a surface INDEPENDENT of the gh-pages origin
      # they verify. So commit the per-version integrity.json into the REPO
      # (integrity/v<version>/) and tag v<version>; site-main's build (R3-15)
      # ingests them from git-at-tag, never from immediately-run.github.io. Guarded
      # like the npm publish: a [skip ci] commit only when the trust root changed,
      # a tag only when v<version> doesn't already exist.
      #
      # IMMUTABILITY GUARD: sync-repo-integrity.mjs FAILS (exit 1) if an
      # already-committed version's manifest would change — i.e. a published
      # version's bytes were mutated without a version bump. It runs BEFORE the
      # gh-pages deploy below, so a violation also stops the mutated bytes from
      # being published. This is what would have caught the 0.8.0 divergence
      # (R3-19/R3-21 landed on main after the v0.8.0 tag without a bump); the fix
      # is always to bump the package version.
      - name: Commit integrity trust root + tag the release
        id: trust-root
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          node scripts/sync-repo-integrity.mjs gh-pages-publish
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add integrity/
          if git diff --cached --quiet; then
            echo "::notice::integrity trust root already up to date."
          else
            git commit -m "chore(integrity): sync SDK trust root for ${TAG} [skip ci]"
            # Rebase before pushing: the release job can run minutes behind HEAD
            # (approvals queue it), and a plain push loses the race to any merge
            # that landed meanwhile — which aborts the job BEFORE the npm publish
            # and Pages deploy steps. The trust-root commit is generated; rebasing
            # it onto the moved main is always safe.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          # `new_tag` is the "a version actually went out" signal the deploy
          # dispatch below keys on. The release job runs on EVERY approved push to
          # main, but tagging and publishing are idempotent no-ops when the version
          # was not bumped — so the tag being newly created is the one event that
          # means the host's pin range needs to grow.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::tag ${TAG} already exists — skipping."
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "${TAG}" -m "@immediately-run/sdk ${VERSION}"
            git push origin "refs/tags/${TAG}"
            echo "new_tag=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-publish
          # keep_files so previously published v/<version>/ artifacts (each
          # immutable) accumulate rather than being wiped on each docs deploy.
          keep_files: true

      - name: Publish to npm via trusted publishing (skip if version already published)
        env:
          # setup-node's registry-url writes an .npmrc that binds npm to NODE_AUTH_TOKEN.
          # Clearing it forces npm to use OIDC trusted publishing instead of (empty) token
          # auth, which otherwise fails with ENEEDAUTH.
          NODE_AUTH_TOKEN: ""
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VER already published — skipping."
            exit 0
          fi
          npm publish --access public

      # --- Close the sdk-integrity staleness window -------------------------
      #
      # The host pins a per-version SHA-384 of every self-hosted SDK file and the
      # sandbox bundler FAILS CLOSED on a version the pin does not cover
      # (SDK_PACKAGING_SPEC §5.2). That manifest is assembled at site-main DEPLOY
      # time from this repo's newest release tag — so the moment a new version is
      # tagged here, every already-deployed host is one version short, and the
      # first app to pin the new version breaks until someone deploys.
      #
      # Not hypothetical: 0.48.0 published 2026-08-25 14:25Z, `agent-demo` pinned
      # ^0.48.0 at 14:32Z, and the agent workbench threw "no host-pinned integrity
      # entry" in production until the next deploy at 15:16Z. Nothing caught it —
      # the deploy's own coverage gate asserts only the floor and
      # DEFAULT_SDK_VERSION, which cannot extend to whatever version an app in
      # another repo decides to pin.
      #
      # THE CONDITION IS THE INVARIANT, NOT THIS RUN'S HISTORY. An earlier version
      # of this step fired on "did THIS run create a tag", which is subtly wrong in
      # the one case that matters: when a dispatch FAILS after the tag is pushed
      # (as it did at 17:44Z on 2026-08-25), every later run sees the tag already
      # existing, skips, and the window stays open forever while each run reports
      # success. Asking instead whether the DEPLOYED manifest covers the version we
      # now hold makes the step idempotent and self-healing — it retries by itself
      # after any failed, skipped, or deleted dispatch, and does nothing when there
      # is nothing to do.
      #
      # (It was in fact deleted once: PR #120's "merge main" resolved a conflict by
      # dropping this step wholesale, leaving `new_tag` as a dead output and the
      # trigger silently inert. A self-healing condition means the next release
      # repairs the manifest even after that kind of regression.)
      #
      # ⚠ WHAT THIS COSTS, stated plainly because it is a real widening: the deploy
      # builds all five repos at `main`, so this promotes whatever is on main across
      # those five repos — not just the manifest. The human decision recorded on
      # THIS run is "publish this SDK version" (the `production` environment
      # approval asserted at the top of this job), which is not the same decision as
      # "promote the current main of five repos". Accepted deliberately
      # (2026-08-25); the deploy workflow's own comment and
      # SIMPLIFIED_DEPLOYMENT_SPEC §5.2 record the other half, including the
      # narrower alternative that was rejected.
      - name: Deploy if the host manifest does not yet cover this version
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          VERSION: ${{ steps.trust-root.outputs.version }}
          NEW_TAG: ${{ steps.trust-root.outputs.new_tag }}
        run: |
          set -euo pipefail
          MANIFEST_URL="https://immediately.run/sdk-integrity.json"
          # One definition, used both to RUN the dispatch and to PRINT it in every
          # failure message — so the command an operator is told to run by hand
          # cannot drift from the one CI actually attempted.
          #
          # `--ref main` is load-bearing, not decoration. Without it `gh workflow
          # run` first RESOLVES the repo's default branch, which is a GraphQL read
          # of `repository.defaultBranchRef` — a Contents/Metadata read, not an
          # Actions one. A token scoped to exactly the authority this step needs
          # (Actions: read+write on immediately-run/deploy, and nothing else) is
          # refused before the dispatch is even attempted:
          #
          #   unable to determine default branch for immediately-run/deploy:
          #   GraphQL: Resource not accessible by personal access token
          #   (repository.defaultBranchRef)
          #
          # Naming the ref removes the lookup, so the credential stays as narrow as
          # the job actually is. Widening the PAT to Contents: read would have
          # "fixed" it by handing a release job read access to a private repo's
          # source to save one flag — the wrong direction (value 1).
          DISPATCH=(gh workflow run deploy.yml --repo immediately-run/deploy --ref main
                    -f sdk_ref=main -f sandpack_ref=main -f sandbox_ref=main
                    -f site_ref=main -f backend_ref=main)
          MANUAL="${DISPATCH[*]}"

          # Does the DEPLOYED host already pin this version? A failed probe is a
          # third outcome, not a "no" — keep it distinct from a real answer.
          #
          # Both failure labels exist because both are reachable, but in practice
          # `malformed` is the common one and `unreachable` is rare: the host
          # SPA-rewrites unknown paths, so a MISSING manifest answers 200 with HTML
          # rather than 404 — `curl -f` succeeds and `jq` is what notices. Measured,
          # not assumed. Either way the case lands in the same branch below.
          if manifest=$(curl -fsS --max-time 20 "$MANIFEST_URL" 2>&1); then
            covered=$(printf '%s' "$manifest" \
                      | jq -r --arg v "$VERSION" '."@immediately-run/sdk" | has($v)' 2>/dev/null \
                      || echo malformed)
          else
            covered="unreachable"
          fi

          case "$covered" in
            true)
              echo "::notice::${MANIFEST_URL} already covers ${VERSION} — no deploy needed."
              exit 0
              ;;
            false)
              if [ "${NEW_TAG:-}" = "true" ]; then
                echo "::notice::${VERSION} was tagged by this run and the deployed manifest does not cover it yet — dispatching."
              else
                echo "::warning::${VERSION} was tagged by an EARLIER run but the deployed manifest still does not cover it — a previous dispatch never landed. Retrying."
              fi
              ;;
            *)
              # Fail TOWARDS dispatching: a redundant deploy is loud and immediately
              # visible, a missed one is a silent fail-closed for every app that
              # pins this version. That is the asymmetry this whole step exists for.
              echo "::warning::Could not determine whether ${MANIFEST_URL} covers ${VERSION} (${covered}). Dispatching anyway — a redundant deploy is cheaper than a silent staleness window."
              ;;
          esac

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DEPLOY_DISPATCH_TOKEN is not set on this repository, so ${VERSION} is published but no deploy was dispatched — every deployed host stays one version short and fails closed for any app that pins it. Add a fine-grained PAT scoped to immediately-run/deploy with Actions: read+write as the DEPLOY_DISPATCH_TOKEN secret, then run: ${MANUAL}"
            exit 1
          fi

          # The newest run BEFORE dispatching. Polling for "a run exists" would
          # match the previous deploy and report success without anything having
          # been queued — the confirmation has to be that the newest id CHANGED.
          # And a FAILED read is a third outcome, not "id 0": swallowing the error
          # into a baseline of 0 makes every later id look new, so the confirmation
          # would pass vacuously in exactly the case where it can see least.
          if before=$(gh run list --repo immediately-run/deploy --workflow deploy.yml \
                      --limit 1 --json databaseId --jq '.[0].databaseId // "none"' 2>&1); then
            baseline_known=1
          else
            baseline_known=0
            echo "::warning::Could not read the deploy repo's run list (${before}); the dispatch below cannot be confirmed, only attempted."
          fi

          if ! "${DISPATCH[@]}"; then
            echo "::error::Dispatching the production deploy failed, and ${VERSION} is already published. Until a deploy runs, any app pinning ${VERSION} fails closed on the missing integrity entry. Run it by hand: ${MANUAL}"
            exit 1
          fi
          echo "::notice::Dispatched immediately-run/deploy for ${VERSION}."

          # Confirm the side effect actually appeared rather than trusting the
          # dispatch API's empty 204 (ways_of_working §2: check the side effect).
          # Deliberately fail-OPEN: the dispatch was accepted, and a slow queue must
          # not fail an otherwise-good release — so an unobserved run is a warning
          # naming the manual command, never a silent pass claiming success. The
          # next release re-checks the manifest anyway, so a missed confirmation
          # self-corrects.
          if [ "$baseline_known" = "0" ]; then
            echo "::warning::Dispatch was accepted for ${VERSION} but could not be confirmed (no baseline). Check https://github.com/immediately-run/deploy/actions and, if nothing is queued, run: ${MANUAL}"
            exit 0
          fi
          for _ in $(seq 1 12); do
            sleep 5
            after=$(gh run list --repo immediately-run/deploy --workflow deploy.yml \
                    --limit 1 --json databaseId,url --jq '.[0]' 2>/dev/null || true)
            id=$(printf '%s' "${after:-}" | jq -r '.databaseId // "none"' 2>/dev/null || echo none)
            if [ "${id}" != "none" ] && [ "${id}" != "${before}" ]; then
              echo "::notice::Deploy run: $(printf '%s' "$after" | jq -r '.url')"
              exit 0
            fi
          done
          echo "::warning::Dispatch was accepted but no NEW deploy run became visible within 60s (newest is still ${before}). Check https://github.com/immediately-run/deploy/actions and, if nothing is queued, run: ${MANUAL}"

  # @immediately-run/safe-content — the S3 content-framework's first extraction
  # (PLATFORM_LAYERING_SPEC §4, R3-279 phase 2). A second package in this repo with
  # its OWN install/build/test/publish, so the SDK's release apparatus (gh-pages,
  # integrity trust root) stays scoped to @immediately-run/sdk.
  #
  # ⚠ OPERATOR PREREQUISITE (one-time): npm trusted publishing must be configured for
  # @immediately-run/safe-content on npmjs.com (repository = immediately-run/immediately-run-sdk),
  # and the `production` environment's approvers cover this job too (it publishes a
  # public package, so it takes the same human gate).
  #
  # BOOTSTRAP NOTE: the package depends on @immediately-run/mdx-plugins 0.5.0 (PR #4's
  # publish). Until that is on the registry this job fails at install BY DESIGN, and
  # `npm install` stands in for `npm ci` (no lockfile can exist before first publish —
  # switch to `npm ci` + commit safe-content/package-lock.json in the follow-up that
  # lands phase 3).
  safe-content:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install -g npm@11
      - name: Install, build, test (the package's own verify)
        working-directory: safe-content
        run: |
          npm install --no-audit --no-fund
          npm run verify
      - name: Assert this run cleared the `production` approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPROVALS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals")
          COUNT=$(printf '%s' "$APPROVALS" | jq '[.[] | select(.state == "approved") | select(any(.environments[]?; .name == "production"))] | length')
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::No human approval recorded for environment 'production' on this run. Refusing to publish an irreversible public version unattended (R-TA-1)."
            exit 1
          fi
      - name: Publish to npm via trusted publishing (skip if version already published)
        working-directory: safe-content
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -uo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VER already published — skipping."
            exit 0
          fi

          # Does the package NAME exist at all? A first publish and a new version of
          # an existing package fail for completely different reasons, and raw npm
          # output does not distinguish them: both surface as `ENEEDAUTH`, which
          # reads like a broken token and sends you to look at permissions that are
          # in fact correct. This is what that cost on 2026-08-25 — the first
          # @immediately-run/safe-content publish failed with ENEEDAUTH while the
          # SDK's own publish, same workflow and same `id-token: write`, succeeded a
          # minute earlier.
          if npm view "$PKG_NAME" version >/dev/null 2>&1; then
            FIRST_PUBLISH=0
          else
            FIRST_PUBLISH=1
            echo "::notice::$PKG_NAME is not on the registry yet — this is its first publish."
          fi

          if npm publish --access public; then
            exit 0
          fi

          if [ "$FIRST_PUBLISH" = "1" ]; then
            echo "::error::First publish of $PKG_NAME failed. OIDC trusted publishing authenticates against a trusted publisher configured ON the npm package, and a name that has never been published has none to match — unless a PENDING publisher was pre-registered. Fix by either (a) configuring a pending trusted publisher for $PKG_NAME on npmjs.com pointing at immediately-run/immediately-run-sdk, workflow .github/workflows/ci.yml, environment production; or (b) publishing this first version once with a granular npm token. Every later publish then runs unattended. This is NOT a token or permissions fault — $PKG_NAME cannot bootstrap itself."
          else
            echo "::error::Publishing $PKG_NAME@$PKG_VER failed. The package already exists, so this is not the first-publish bootstrap: check that its trusted publisher on npmjs.com still names this repo and workflow, and that package.json repository.url matches the repo (npm answers E422 when it does not)."
          fi
          exit 1
