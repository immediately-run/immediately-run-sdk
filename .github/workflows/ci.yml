name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# R-TA-1 (TESTING_AUTOMATION_SPEC §6): publishing a public artifact is
# DECISION-gated, not mechanical — an npm version is irreversible and
# consumer-facing, so it is production-promotion-class. The release half is
# therefore split out of the PR-validating build into its own job that declares
# `environment: production` (a GitHub Environments protection rule with required
# reviewers = the one-click human approval), and asserts at run time that the
# approval actually happened. Keeping it in one job would have gated every PR
# run behind an approval too, which is why this is a split rather than one added
# line.
jobs:
  # Runs on every PR and every push to main. Holds NO write/publish authority —
  # the release job below is the only one that does.
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false  # never use caching in release builds
      # Trusted publishing requires npm >= 11.5.1. Pin to the 11.x line: npm@latest
      # went to 12.0.0 (2026-07), whose provenance path throws `Cannot find module
      # 'sigstore'` under `npm publish` (a .0 major regression that broke the 0.29.0
      # publish here, and 0.5.0 in the transpiler). 11.x stays >= 11.5.1 and
      # publishes cleanly; revisit when 12.x is fixed.
      - run: npm install -g npm@11
      - run: npm ci
      # The formatting gate. `format:check`, never `format -- --check`: appending
      # --check to a `prettier --write` script does not make it read-only — Prettier
      # rewrites the tree and exits 0, which is how the sandbox repo drifted 106 files
      # behind a step that looked like a gate.
      - run: npm run format:check
      # Fail fast on a circular import — the sandbox bundler infinite-loops on one
      # at app boot ("Maximum call stack size exceeded"). Caught the 0.2.7 cycle.
      - run: npm run check:circular
      - run: npm test
      - run: npm run build
      # Fail if a public export was removed/renamed vs api-snapshot.json — pinned
      # forks depend on the API never shrinking (SDK_PACKAGING_SPEC §9). Runs after
      # build because it reads the emitted dist/*.d.ts.
      - run: npm run api:check
      # R3-274 (PLATFORM_LAYERING_SPEC §2, Phase 1): the WIRE surface, which
      # `api:check` never sees — it compares module exports, not message names.
      # Renaming or reshaping a sandbox↔SDK message breaks every app pinned to an
      # older SDK against a newer frame; before this gate any wire string could
      # change with nothing firing (a live instance already exists: `fs-change`
      # carries two shapes). Extracts from src/ with the TypeScript checker, so it
      # runs without a build. `--self-test` runs alongside: a gate that finds zero
      # names must fail, not pass.
      - run: npm run protocol:check
      - run: npm run protocol:selftest
      # R3-274e1: `protocol:check` proves THIS source matches the pinned contract.
      # It says nothing about the SDKs already on npm, which is the population that
      # actually matters — apps pin their own version (SDK_PACKAGING_SPEC §9), so a
      # wire change breaks artifacts nobody can edit any more. This unpacks real
      # published tarballs and drives their `dist/` against the shared fixture, so
      # the verdict is measured, not reasoned about. Listed here and not left to
      # `verify` alone: this job enumerates the gates rather than running `verify`,
      # so a gate that is only in `verify` is a gate CI does not have.
      - run: npm run compat:selftest
      - run: npm run compat:previous
      # R3-166: the gate-table→SDK descriptor set is the proposed single source for
      # the generated surface. This fails if it disagrees with what actually ships —
      # a descriptor naming an export the SDK doesn't have, or making a different
      # wire call. Without it the descriptors drift silently, and the drift is only
      # discovered by whoever finally tries to generate from them (they had, to a
      # `shareSpace` method that never existed). Reads the built dist/, so it runs
      # after `build`. NOT in `prepublishOnly`: nothing published consumes the
      # descriptors yet, so this must never be what blocks a release.
      - run: npm run verify:codegen-parity
      - run: npm run docs

  # The public-release job: gh-pages self-host artifact + integrity trust root +
  # git tag + npm publish. Every step here is irreversible or consumer-facing.
  #
  # ⚠ OPERATOR PREREQUISITE (one-time, per repo — cannot be done from a PR):
  #   Settings → Environments → New environment `production` → enable
  #   "Required reviewers" and add the maintainer(s).
  # Declaring `environment:` for an environment that does not exist makes GitHub
  # AUTO-CREATE it with NO protection rules — i.e. the gate silently becomes a
  # no-op, the exact failure this item exists to remove. That is why the first
  # step below re-reads this run's own approval history and FAILS CLOSED when no
  # human approval is recorded, instead of trusting the `environment:` key.
  # `deploy/scripts/verify-release-gates.mjs` is the settings-side companion
  # check (run it after configuring the environment).
  release:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # gh-pages deploy + integrity trust-root commit/tag
      id-token: write   # npm trusted publishing (OIDC)
      actions: read     # read THIS run's approval history (the assertion below)
    steps:
      # Fail-closed authority gate (ways_of_working §2 "authority gates fail
      # closed"): a run that reached here without a recorded `production`
      # approval means the protection rule is missing or was removed. Refuse to
      # publish rather than publish an irreversible version unattended.
      - name: Assert this run cleared the `production` approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPROVALS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals")
          COUNT=$(printf '%s' "$APPROVALS" | jq '[.[] | select(.state == "approved") | select(any(.environments[]?; .name == "production"))] | length')
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::No human approval recorded for environment 'production' on this run. The Environments protection rule is missing (GitHub auto-creates an UNPROTECTED environment when one is declared but absent). Configure Settings → Environments → production → Required reviewers, then re-run. Refusing to publish an irreversible public version unattended (TESTING_AUTOMATION_SPEC R-TA-1)."
            exit 1
          fi
          printf '%s' "$APPROVALS" | jq -r '.[] | select(.state == "approved") | "approved by \(.user.login): \(.comment // "")"'

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - run: npm install -g npm@11
      - run: npm ci
      # A fresh build in the release job: jobs share no filesystem, and the
      # gh-pages payload below is assembled from `dist/` + `docs/`. The
      # correctness gates (test / check:circular / api:check / codegen-parity)
      # are NOT repeated — `needs: build-test` already required them to pass on
      # this exact commit.
      - run: npm run build
      - run: npm run docs

      # Assemble the gh-pages payload: typedoc docs at the root + the versioned,
      # self-hosted SDK build under v/<version>/ (SDK_PACKAGING_SPEC §5 — the
      # SOLE SDK delivery path; every app's pinned version resolves from here,
      # available the instant this CI finishes, no npm→CDN replication lag).
      # build-selfhost.mjs also emits v/<version>/integrity.json (SHA-384 per
      # fetchable file, §5.2) so verifiers can pin the artifact bytes. The
      # backfill step adds integrity.json for every PUBLISHED version from the
      # floor (0.2.8) up to current, so the trust root + sdk-integrity.json cover
      # the whole floor..current pin range (SP2-2) — idempotent, skips versions
      # already present (keep_files preserves the rest of each immutable dir).
      - name: Assemble gh-pages payload (docs + versioned SDK build + integrity)
        run: |
          rm -rf gh-pages-publish
          cp -r docs gh-pages-publish
          node scripts/build-selfhost.mjs gh-pages-publish
          node scripts/backfill-all-integrity.mjs 0.2.8 gh-pages-publish

      # R3-288: the payload the sandbox loads has no dependency tree, so a bare
      # specifier that is not app-provided is a module-not-found at boot — a blank
      # frame for every app on that version. 0.45.0/0.45.1 shipped four such files
      # past a green `api:check`, a valid integrity manifest and a green `verify`:
      # those check the SHAPE of the surface and the INTEGRITY of the bytes, and
      # neither asks whether the bytes can load. Runs BEFORE the deploy, so a
      # payload that cannot load never reaches the origin.
      - name: Assert the self-hosted payload is resolvable in the sandbox
        run: |
          node scripts/check-selfhost-resolvable.mjs --self-test
          node scripts/check-selfhost-resolvable.mjs --dir "gh-pages-publish/v/$(node -p "require('./package.json').version")"

      # SDK trust root (SDK_PACKAGING_SPEC §5.2.1 / SP2-2, decision #6): the hashes
      # site-main pins must come from a surface INDEPENDENT of the gh-pages origin
      # they verify. So commit the per-version integrity.json into the REPO
      # (integrity/v<version>/) and tag v<version>; site-main's build (R3-15)
      # ingests them from git-at-tag, never from immediately-run.github.io. Guarded
      # like the npm publish: a [skip ci] commit only when the trust root changed,
      # a tag only when v<version> doesn't already exist.
      #
      # IMMUTABILITY GUARD: sync-repo-integrity.mjs FAILS (exit 1) if an
      # already-committed version's manifest would change — i.e. a published
      # version's bytes were mutated without a version bump. It runs BEFORE the
      # gh-pages deploy below, so a violation also stops the mutated bytes from
      # being published. This is what would have caught the 0.8.0 divergence
      # (R3-19/R3-21 landed on main after the v0.8.0 tag without a bump); the fix
      # is always to bump the package version.
      - name: Commit integrity trust root + tag the release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          node scripts/sync-repo-integrity.mjs gh-pages-publish
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add integrity/
          if git diff --cached --quiet; then
            echo "::notice::integrity trust root already up to date."
          else
            git commit -m "chore(integrity): sync SDK trust root for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::tag ${TAG} already exists — skipping."
          else
            git tag -a "${TAG}" -m "@immediately-run/sdk ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-publish
          # keep_files so previously published v/<version>/ artifacts (each
          # immutable) accumulate rather than being wiped on each docs deploy.
          keep_files: true

      - name: Publish to npm via trusted publishing (skip if version already published)
        env:
          # setup-node's registry-url writes an .npmrc that binds npm to NODE_AUTH_TOKEN.
          # Clearing it forces npm to use OIDC trusted publishing instead of (empty) token
          # auth, which otherwise fails with ENEEDAUTH.
          NODE_AUTH_TOKEN: ""
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VER already published — skipping."
            exit 0
          fi
          npm publish --access public
