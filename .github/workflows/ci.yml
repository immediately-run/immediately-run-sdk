name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for gh-pages deploy
      id-token: write   # for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      # Fail fast on a circular import — the sandbox bundler infinite-loops on one
      # at app boot ("Maximum call stack size exceeded"). Caught the 0.2.7 cycle.
      - run: npm run check:circular
      - run: npm test
      - run: npm run build
      # Fail if a public export was removed/renamed vs api-snapshot.json — pinned
      # forks depend on the API never shrinking (SDK_PACKAGING_SPEC §9). Runs after
      # build because it reads the emitted dist/*.d.ts.
      - run: npm run api:check
      - run: npm run docs

      # Assemble the gh-pages payload: typedoc docs at the root + the versioned,
      # self-hosted SDK build under v/<version>/ (SDK_PACKAGING_SPEC §5 — the
      # SOLE SDK delivery path; every app's pinned version resolves from here,
      # available the instant this CI finishes, no npm→CDN replication lag).
      # build-selfhost.mjs also emits v/<version>/integrity.json (SHA-384 per
      # fetchable file, §5.2) so verifiers can pin the artifact bytes. The
      # backfill step adds integrity.json for every PUBLISHED version from the
      # floor (0.2.8) up to current, so the trust root + sdk-integrity.json cover
      # the whole floor..current pin range (SP2-2) — idempotent, skips versions
      # already present (keep_files preserves the rest of each immutable dir).
      - name: Assemble gh-pages payload (docs + versioned SDK build + integrity)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf gh-pages-publish
          cp -r docs gh-pages-publish
          node scripts/build-selfhost.mjs gh-pages-publish
          node scripts/backfill-all-integrity.mjs 0.2.8 gh-pages-publish

      # SDK trust root (SDK_PACKAGING_SPEC §5.2.1 / SP2-2, decision #6): the hashes
      # site-main pins must come from a surface INDEPENDENT of the gh-pages origin
      # they verify. So commit the per-version integrity.json into the REPO
      # (integrity/v<version>/) and tag v<version>; site-main's build (R3-15)
      # ingests them from git-at-tag, never from immediately-run.github.io. Guarded
      # like the npm publish: a [skip ci] commit only when the trust root changed,
      # a tag only when v<version> doesn't already exist.
      - name: Commit integrity trust root + tag the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          node scripts/sync-repo-integrity.mjs gh-pages-publish
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add integrity/
          if git diff --cached --quiet; then
            echo "::notice::integrity trust root already up to date."
          else
            git commit -m "chore(integrity): sync SDK trust root for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::tag ${TAG} already exists — skipping."
          else
            git tag -a "${TAG}" -m "@immediately-run/sdk ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-publish
          # keep_files so previously published v/<version>/ artifacts (each
          # immutable) accumulate rather than being wiped on each docs deploy.
          keep_files: true

      - name: Publish to npm via trusted publishing (skip if version already published)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # setup-node's registry-url writes an .npmrc that binds npm to NODE_AUTH_TOKEN.
          # Clearing it forces npm to use OIDC trusted publishing instead of (empty) token
          # auth, which otherwise fails with ENEEDAUTH.
          NODE_AUTH_TOKEN: ""
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VER already published — skipping."
            exit 0
          fi
          npm publish --access public
