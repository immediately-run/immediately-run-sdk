name: pages

# Deploys the `gh-pages` BRANCH to GitHub Pages through the Actions-based deploy
# (actions/deploy-pages), not the legacy branch builder.
#
# Why: the branch is the accumulating store of every self-hosted SDK version
# (SDK_PACKAGING_SPEC §5: `v/<version>/`, each immutable), ~26k files and growing by
# ~340 per release. On 2026-11-04 the legacy builder's generated
# `pages-build-deployment` workflow accepted three deployments in a row and never
# reported a status, so its fixed 10-minute deploy timeout cancelled each one and
# the origin kept serving the 2026-10-22 build: `/v/0.93.0/` was 404 and every app
# pinned to it failed closed. deploy-pages caps its own timeout at the same 10 minutes
# (its MAX_TIMEOUT); what this workflow gains is that a failed deploy fails THIS run
# visibly.
#
# Two jobs, upload then deploy (`needs:`), the layout every repo's cache.yml uses.
# From 2026-11-20 the one-job form (upload and deploy in the same job) failed on every
# run: deploy-pages found 0 artifacts although the upload had finished and the REST API
# listed it, while cache.yml deployed with the same action SHAs in two jobs.
#
# The release job (ci.yml) still pushes the payload to the branch with keep_files;
# this workflow only publishes the branch as it stands. Called by ci.yml after a
# release, and runnable by hand to redeploy the current branch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write     # deploy-pages
      id-token: write  # deploy-pages verifies the run's OIDC token
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages' maximum (10 minutes); a larger value is clamped with a warning.
          timeout: 600000
